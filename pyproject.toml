[project]
name = "NeuroTemplate"
version = "0.2.0"
description = "A template for system identification and differentiable predictive control."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beartype>=0.22.3",
    "matplotlib>=3.10.7",
    "mlflow>=3.9.0",
    "numpy>=2.2.6",
    # ONNX export (neurotemplate.export). onnxruntime 1.24 ships no cp310
    # wheels, and this project still supports 3.10.
    "onnx>=1.17",
    "onnxruntime>=1.20,<1.24",
    "onnxscript>=0.5",
    "pandas>=2.3.3",
    "pyyaml>=6.0",
    "torch>=2.9.0",
]

[project.urls]
Homepage = "https://github.com/pnnl/NeuroTemplate"
Repository = "https://github.com/pnnl/NeuroTemplate"
Issues = "https://github.com/pnnl/NeuroTemplate/issues"

[project.scripts]
# Single dispatcher: `nt <group> <verb>`. See neurotemplate/cli.py for the
# command table (nt model train, nt control train, ...).
nt = "neurotemplate.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neurotemplate"]

[project.optional-dependencies]
# neurotemplate.prep's smoother; training never imports it.
prep = [
    "statsmodels>=0.14",
]
dev = [
    "pytest>=8.0",
    "neurotemplate[prep]",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
