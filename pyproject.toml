[project]
name = "NeuroTemplate"
version = "0.1.0"
description = "Neuromancer-based template for system identification and differentiable predictive control."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beartype>=0.22.3",
    # neuromancer.callbacks imports IPython.display without declaring it.
    "ipython",
    "matplotlib>=3.10.7",
    "mlflow>=3.9.0",
    # Pinned to the tip of develop on the official pnnl/neuromancer repo as of
    # 2026-09-15, which carries the linear-memory rollout method this
    # framework depends on. This is the required state for consumers
    # installing from git. Bump the SHA when neuromancer's develop advances.
    "neuromancer @ git+https://github.com/pnnl/neuromancer.git@1f7b4f1c15210d7db92b9b98e8aa97014a867768",
    "numpy>=2.2.6",
    # ONNX export (neurotemplate.export). onnxruntime 1.24 ships no cp310
    # wheels, and this project still supports 3.10.
    "onnx>=1.17",
    "onnxruntime>=1.20,<1.24",
    "onnxscript>=0.5",
    "optuna>=4.8.0",
    "optuna-dashboard>=0.20.0",
    "pandas>=2.3.3",
    "pyyaml>=6.0",
    "torch>=2.9.0",
]

[project.scripts]
# Single dispatcher: `nt <group> <verb>`. See neurotemplate/cli.py for the
# command table (nt model train, nt control train, ...).
nt = "neurotemplate.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neurotemplate"]

# Required so the git-pinned `neuromancer @ git+ssh://...` direct reference in
# project.dependencies is accepted by hatchling at build time.
[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
# neuromancer.modules.operators imports SFNO from neuralop, which was removed
# in neuraloperator 2.0 and requires torch-harmonics. neuromancer declares both
# unpinned, so constrain them to the combination that imports on macOS arm64
# (torch-harmonics 0.9.x ships no darwin wheel; 0.7.3 builds from source).
constraint-dependencies = [
    "neuraloperator<2",
    "torch-harmonics<0.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
