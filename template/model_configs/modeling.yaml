# System-ID surrogate training config. `nt model train` reads this file by
# default. Every field below is shown with its built-in default, commented
# out — uncomment only what you change. Override any of them per-run with
# `--set key=value`, and check the result with `--print-config`.

# ── DATA ─────────────────────────────────────────────────────────
# Required. Each may be one path or a list of paths; with a list, files are
# windowed independently and pooled, so no rollout ever spans two files.
train_data_path: data/train.csv
dev_data_path: data/dev.csv
test_data_path: data/test.csv
# JSON of known gradient signs; required when grad_gain > 0.
# grad_path: data/grad/mapping.json
# batch_size: 256
# Normalization: min_max | abs_max | z_score | null (none).
# norm_type: z_score
# Substring patterns; matching columns are dropped before Y/U/D mapping.
# exclude_columns: []
# Path or dotted module name of the hooks file. Unset = modeling_user_defined.py in CWD.
# user_hooks_path: null

# ── MODEL ────────────────────────────────────────────────────────
# Family: mlp | nssm | lssm | gru | 2r2c | dummy. "2r2c" is the grey-box
# thermal model — see the 2R2C block below. "dummy" is a passthrough used to
# mint a checkpoint without identifying anything.
# model: nssm
# Context length: how much history the model sees before the first scored
# prediction, and the stride between training windows. Every family reads it as
# a flattened input window; gru and 2r2c also carry a hidden state, so during a
# rollout their memory runs past in_steps.
# in_steps: 12
# Hidden width is 2**log2_hidden_size.
# log2_hidden_size: 8
# num_layers: 3
# Predict the delta from the current state instead of the state itself.
# residual: true
# Give each block from the block_mapping hook its own sub-model, with its own
# parameters and hidden state. mlp and gru only; 2r2c is always per-block.
# A block that names its own `model` needs no flag — this one is for splitting
# every block under a single family. (Field name kept for compatibility.)
# per_zone: false

# ── 2R2C ─────────────────────────────────────────────────────────
# Only read when model: 2r2c. The RC network's three component time constants
# in hours — zone<->ambient, zone<->mass from the zone's side, and mass<->zone
# from the mass's side. The last two differ by the capacitance ratio
# C_mass / C_zone, so 1 against 4 makes the mass four times heavier than the
# air. The defaults give a 0.6 h fast mode and a 13.4 h slow one on 5-minute
# data; the reportcard prints what you actually got.
#
# These are a prior, not a fit. The mass temperature is unobserved, so a
# training rollout cannot identify them, and left trainable the optimizer
# shortens the slow mode to hide a mass it had to guess. Set them from what
# you know: a measured free-decay time constant is what tau_slow should match.
# rc_tau_ambient_h: 2.0
# rc_tau_zone_mass_h: 1.0
# rc_tau_mass_zone_h: 4.0
# Let training move the three above. Worth it only when the rollout is long
# relative to the slow mode and the data excites it.
# rc_train_taus: false

# ── TRAIN ────────────────────────────────────────────────────────
# epochs: 300
# Print cadence, in epochs.
# epoch_verbose: 1
# Epochs before early stopping is allowed to trigger.
# warmup: 5
# patience: 25
# Rollout length during training; each window is in_steps + train_pred_steps.
# train_pred_steps: 48
# Curriculum stages, each multiplying train_pred_steps by curriculum_ratio.
# 0 disables the curriculum.
# curriculum_steps: 0
# curriculum_ratio: 4.0
# lr: 0.001

# ── DEV ──────────────────────────────────────────────────────────
# Fixed validation horizon, so dev loss stays comparable across curriculum stages.
# dev_pred_steps: 48

# ── TEST ─────────────────────────────────────────────────────────
# Evaluation window length, in_steps warmup included.
# test_window: 287
# Gap between the start of consecutive test windows.
# test_stride: 288

# ── LOSS ─────────────────────────────────────────────────────────
# Weight on plain state-tracking error.
# ref_gain: 1.0
# Weight on matching the first difference (velocity) of each channel.
# vel_gain: 0.0
# Weight on penalizing velocity sign errors (softplus-shaped).
# sgn_gain: 0.0
# sgn_steepness: 2.0

# ── RUNTIME ──────────────────────────────────────────────────────
# -1 draws a random seed and records it with the run.
# seed: -1
# cpu | cuda | mps; unset auto-detects.
# device: null
# verbose: true

# ── LOGGING ──────────────────────────────────────────────────────
# Scratch dir for run artifacts; unset generates a unique temp_<hash>.
# savedir: temp_<random>
# MLflow tracking store.
# location: sqlite:///mlflow.db
# exp: Model Training
# MLflow run name; the model family is prefixed automatically.
run: ""
# plots_dir: plots
# plot: true
# Which curriculum stage's weights to keep: last_step | all | None.
# save_config: last_step

# ── OPTUNA (nt model optuna) ─────────────────────────────────────
# Search space lives in modeling_user_defined.hyper_args.
# n_trials: 100
# study_name: study
# Epochs per search trial; the winner is retrained for the full `epochs`.
# trial_epochs: 100
# optuna_dir: optuna_dbs
# Seeds averaged per trial, to stop noise winning the search.
# trial_seeds: 3

# ── PHYSICS PENALTIES ────────────────────────────────────────────
# Gradient-sign penalty weight; > 0 requires grad_path. 0 disables.
# grad_gain: 0.0
# Random off-trajectory points sampled per step for the gradient penalty.
# grad_n_samples: 128
# The physics scenarios are assertions, not a loss term: whenever
# modeling_user_defined.synth_cfg returns a SynthSpec, the run asserts them
# after training and reports pass/fail per scenario in physical units. There is
# no weight to tune. Physicality during training is grad_gain's job.
# Scenario instances per check, and how long each one is rolled out, in HOURS
# (converted against the data's own sampling frequency). A longer horizon is a
# harder test — a model can hold for 30 minutes and diverge over 4 hours — and
# the reachability bound is only as meaningful as the time it was given.
# synth_n_scenarios: 32
# synth_hours: 4.0
# Scenario instances drawn on the diagnostic figures.
# synth_n_plot: 4
# Y-axis unit label on those figures. Override if your state channels
# aren't in Celsius.
# synth_y_unit: "°C"
