# System-ID surrogate config. `nt model train` reads this file by default.
# Fields are shown at their built-in defaults, commented out — uncomment what
# you change. Override any of them per run with `--set key=value`, and check
# the result with `--print-config`. Step counts are in timesteps of your data.
# Change one thing per run and keep each run's config (a numbered copy), so
# the sequence stays readable afterwards.

# ── DATA ─────────────────────────────────────────────────────────
# Required. Each may be one path or a list; files in a list are windowed
# independently and pooled, so no window spans two files.
train_data_path: data/train.csv
dev_data_path: data/dev.csv
test_data_path: data/test.csv
# batch_size: 256
# min_max | abs_max | z_score | null. Per-column overrides: column_norm_config.
# norm_type: z_score
# Substring patterns; data_mapping drops matching columns.
# exclude_columns: []
# Hooks file (path or dotted module). Unset = modeling_user_defined.py in CWD.
# user_hooks_path: null

# ── MODEL ────────────────────────────────────────────────────────
# Test error is measured on whatever excitation your data has, which is
# rarely where a controller will drive the plant; it does not pick a
# surrogate for control. The reportcard's rollout-stability and physics
# sections are the readouts for that.
# Family: mlp | nssm | lssm | gru | 2r2c.
#   2r2c   grey-box thermal network: a state, a hidden mass, conduction to
#          ambient, a heat input. Stable under any input by construction,
#          with storage time constants you can read and check — the family
#          for a temperature a controller will plan against.
#   mlp, nssm, lssm, gru   black boxes. Often the best fit, but nothing
#          bounds a long rollout; read the reportcard's rollout-stability
#          and physics sections before steering with one.
# Families can be mixed, one per block of Y channels — see `block_mapping`
# in modeling_user_defined.py (e.g. one 2r2c block per zone, an mlp for a meter).
# model: nssm
# Required: steps before the current one the model reads, per column. List
# every Y, U and D column; there is no default. The names and numbers below
# are syntax, not values. The deepest lag sets the window every block shares
# (history_steps = deepest + 1), the seeded history before the first
# prediction, and the stride between training windows. Each learned map
# reads a column at its own lag, except that a gru reads one lag for every
# column it reads (its window is its warm-up), and a 2r2c block reads its own
# Y columns at one lag and its U and D at the current step only, so a U or D
# column only 2r2c blocks read is listed at 0. gru and 2r2c also carry state
# through a rollout. A lag is worth its inputs when the column still tells
# the model something, that far back, that its other inputs do not; the
# reportcard lists what each block reads.
history:
  "Tank Temperature [degC]": 11
  "Heater Command [-]": 0
  "Ambient Temperature [degC]": 3
# Network width is 2**log2_hidden_size. Under 2r2c this net only maps the
# columns you left undeclared to a heat flow, and it can be very small.
# Larger nets tend to buy fit with physics: start small, and grow one when
# the reportcard says the model underfits, not because dev loss went down.
# log2_hidden_size: 6
# num_layers: 3
# Predict the change from the current state rather than the state.
# residual: true
# Split every block under one mlp or gru family. Not needed when a block
# names its own `model`; 2r2c is always per-block.
# per_block: false

# ── 2R2C ─────────────────────────────────────────────────────────
# A 2r2c block's time constants are declared per block, in block_mapping's
# `params` (modeling_user_defined.py). Here only the learning rate for its
# physical scalars — bounded time constants, declared-branch coefficients.
# At `lr` they barely leave their start.
# rc_branch_lr: 0.05

# ── TRAIN ────────────────────────────────────────────────────────
# epochs: 300
# epoch_verbose: 1
# Epochs before early stopping may trigger, then epochs without improvement.
# warmup: 5
# patience: 25
# Rollout length per training window. A rollout much shorter than the
# plant's slow dynamics lets a model re-read its inputs instead of learning
# to integrate them.
# train_pred_steps: 48
# Stages that each multiply train_pred_steps by curriculum_ratio. 0 = off.
# curriculum_steps: 0
# curriculum_ratio: 4.0
# lr: 0.001
# Fixed validation horizon, so dev loss compares across curriculum stages.
# dev_pred_steps: 48
# Test window length (history_steps included) and stride. The defaults are one
# day of 5-minute data.
# test_window: 287
# test_stride: 288

# ── LOSS ─────────────────────────────────────────────────────────
# ref_gain: 1.0          # state-tracking error

# ── BINARY / ORDINAL HEADS ───────────────────────────────────────
# Weight each levelled head's loss by inverse square-root level frequency.
# balance_levels: true
# After training, fit each ordinal head's thresholds on dev rollouts.
# calibrate_thresholds: true

# ── RUNTIME ──────────────────────────────────────────────────────
# -1 draws a random seed and records it with the run.
# seed: -1
# Train this many seeds (seed, seed+1, ...) and report their spread on the
# reportcard; only the first is saved. Differences between two configs are
# often inside this spread on small datasets.
# ensemble_seeds: 1
# cpu | cuda | mps; unset auto-detects.
# device: null
# verbose: true

# ── LOGGING ──────────────────────────────────────────────────────
# Scratch dir for run artifacts; unset generates a unique temp_<hash>.
# savedir: temp_<random>
# location: sqlite:///mlflow.db
# exp: Model Training
# MLflow run name; the family is prefixed automatically.
run: ""
# plots_dir: plots
# plot: true
# Which weights to keep: last_step (the run's final checkpoint), all (that,
# plus each curriculum stage's in its child run) or None (none; the run
# cannot be reloaded).
# save_config: last_step

# ── OPTUNA (nt model optuna) ─────────────────────────────────────
# The search space is modeling_user_defined.hyper_args.
# n_trials: 100
# study_name: study
# Epochs per trial; the winner is retrained for the full `epochs`.
# trial_epochs: 100
# optuna_dir: optuna_dbs
# Seeds averaged per trial.
# trial_seeds: 3

# ── PHYSICS ──────────────────────────────────────────────────────
# Gradient-sign penalty, evaluated at random off-trajectory points: the
# mean sign violation per declared (output, input) pair, so a gain means the
# same however many channels the plant has. 0 = off; > 0 requires grad_path
# (written by write_gradient_mapping in modeling_user_defined.py). Size it by
# what the physics section does, not by switching it on.
# grad_gain: 0.0
# grad_path: data/grad/mapping.json
# grad_n_samples: 128
# The physics checks (equilibrium, step response, reachability, free decay)
# run after training whenever synth_cfg returns a spec. They are instruments:
# read a failure as a diagnosis (see synth_cfg), not as a wall. Instances per check,
# and horizon in hours: raise the count if pass rates swing between seeds,
# and keep the horizon comparable to the plant's slow time constant.
# synth_n_scenarios: 32
# synth_hours: 4.0
# Instances drawn on the diagnostic figures.
# synth_n_plot: 4
