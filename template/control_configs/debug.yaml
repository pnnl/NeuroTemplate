# A 2-epoch run that exercises the whole control pipeline — hooks, closed
# loop, reportcard — before you train for real:
#   nt control train --config control_configs/debug.yaml --set sysid_run_id=<id>
# Copy the band (and residual_delta, if you use one) from your real config.

sysid_run_id: ""

train_data_path: data/train.csv
dev_data_path: data/dev.csv
test_data_path: data/test.csv

in_steps: 4
train_pred_steps: 4

# Required, in the physical units of the regulated channel.
band_lo: null
band_hi: null

log2_policy_hidden: 3
policy_layers: 1

epochs: 2
warmup: 0
patience: 2

test_window: 47
test_stride: 48

seed: 1234
run: "debug"
