# DPC policy training config. `nt control train` reads this file by default.
# Fields are shown at their built-in defaults, commented out — uncomment what
# you change. Y/U/D roles and normalization come from the frozen surrogate.
# Step counts are in timesteps of your data.

# ── SURROGATE ────────────────────────────────────────────────────
# Required: the MLflow run id `nt model train` printed ("Finished run: ...").
# Or pass it per run: --set sysid_run_id=<id>
sysid_run_id: ""
# Override the run's artifact directory.
# run_dir: null
# Explicit weights file; unset uses best_model_state_dict.pth from the run.
# weights: null

# ── DATA ─────────────────────────────────────────────────────────
# Required, never inherited from the sys-id run: train the policy on the
# windows you want it to control over.
train_data_path: data/train.csv
dev_data_path: data/dev.csv
test_data_path: data/test.csv
# batch_size: 256
# Hooks file (path or dotted module). Unset = control_user_defined.py in CWD.
# user_hooks_path: null

# ── REFERENCES ───────────────────────────────────────────────────
# The columns the objective names that are not the surrogate's: a comfort
# band, a setpoint schedule, a tariff. One file per plant file, row-aligned
# with it and carrying exactly its timestamps (make_references.py writes
# them). Set all three or none. List one plant file several times against
# several reference files to train on several draws of the reference.
train_reference_path: data/train_reference.csv
dev_reference_path: data/dev_reference.csv
test_reference_path: data/test_reference.csv
# The divisor for each reference column that bounds no Y column (a tariff),
# so the policy sees an O(1) input. A band column needs none: it is scaled
# like the column it bounds.
# reference_scale: {"Tariff [$/kWh]": 0.30}
# Future steps of each reference column the policy sees. Shifting load means
# acting before the expensive hours, which a policy can only do if it sees
# them coming; seeing a band change coming lets it move before the zone lags.
# reference_preview: {"Tariff [$/kWh]": 48, "Comfort Low [°C]": 2}

# ── HORIZON ──────────────────────────────────────────────────────
# Closed-loop rollout length in training. It has to span the behaviour you
# want learned — an action and the payoff it buys (a pre-cool and the coast
# after it, a daily peak) must fit inside one rollout.
# train_pred_steps: 48
# History the policy sees.
# in_steps: 12
# Future disturbance steps the policy previews. Ignored if the
# preview_config hook exists — that hook replaces it entirely.
# d_preview: 0

# ── OBJECTIVE ────────────────────────────────────────────────────
# A table of terms, each read in one order: the operand `column − target`
# (target optional), then `map` (relu = a lower bound, nrelu = an upper
# bound, first_difference = step-to-step change), then `norm` (the power
# mean per window: 1 = mean, 2 = RMS, larger approaches the max), with an
# optional per-step `weight` column; then its gain. `column`, `target` and
# `weight` name a Y, U or D column of the surrogate, a reference column, or
# `power` (control_user_defined.power_metric). `units: physical` (default)
# makes a gain per physical unit; `normalized` keeps the surrogate's scale.
# Names below are examples: use your columns.
losses:
  comfort_lower: {column: "Comfort Low [°C]",  target: "Zone Air Temperature [°C]", map: relu,  norm: 2}
  comfort_upper: {column: "Comfort High [°C]", target: "Zone Air Temperature [°C]", map: nrelu, norm: 2}
  du:            {column: "Zone Cooling Setpoint [°C]", map: first_difference, norm: 1}
  # energy: {column: power, norm: 1}
  # cost:   {column: power, norm: 1, weight: "Tariff [$/kWh]"}
  # peak:   {column: power, norm: 4}
# One gain per term, in its own map so a sweep can --set it. Gains are scale
# factors between terms in different units, so they do not port between
# plants. Every run prints each term's share of the objective before and
# after training: a term at ~0% of the trained objective is not in it,
# whatever its gain says.
gains: {comfort_lower: 5.0, comfort_upper: 5.0, du: 1.0}

# ── POLICY ───────────────────────────────────────────────────────
# mlp | linear. `linear` is one saturated affine law, u = sat(Kx + b): few
# parameters, gains you can read, and hard to overfit to the surrogate.
# policy: mlp
# gelu | relu | tanh | silu (mlp only).
# policy_nonlin: gelu
# How the output is squashed into the actuation box: sigmoid_scale (smooth)
# or relu_clamp (hard clip).
# policy_bound_method: sigmoid_scale
# Width 2**log2_policy_hidden (mlp only).
# log2_policy_hidden: 6
# policy_layers: 2
# Snap the output to a grid, in physical units (the actuator's resolution).
# Straight-through, so gradients still flow. 0 = continuous.
# setpoint_step: 0.0

# ── RESIDUAL CONTROL ─────────────────────────────────────────────
# Set to command reference_control(...) + δ, in physical units (needs the
# reference_control hook). It bounds how far surrogate error can move the
# plant from a rule you trust. A number Δ allows -Δ <= δ <= Δ; a pair
# [below, above] allows -below <= δ <= above — [0, 0.5] lets a setpoint the
# rule anchors at an edge move inward and never past it. The same box holds
# for every U column. null = a free policy over the whole actuation box.
# 0 = the rule itself, which is a cheap first run: it scores the rule on your
# surrogate. A non-zero side must be at least setpoint_step when the output
# is quantized.
# residual_delta: null

# ── TRAINING ─────────────────────────────────────────────────────
# epochs: 300
# epoch_verbose: 1
# warmup: 5
# patience: 25
# lr: 0.001

# ── EVAL ─────────────────────────────────────────────────────────
# Closed-loop test window (warmup included) and stride. The defaults are one
# day of 5-minute data.
# test_window: 287
# test_stride: 288

# ── RUNTIME ──────────────────────────────────────────────────────
# seed: -1
# device: null
# verbose: true

# ── LOGGING ──────────────────────────────────────────────────────
# savedir: temp_<random>
# Must be the store the sys-id run was logged to.
# location: sqlite:///mlflow.db
# exp: DPC Training
run: ""
# plots_dir: plots
# plot: true
