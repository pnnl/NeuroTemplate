# DPC policy training config. `nt control train` reads this file by default.
# Fields are shown at their built-in defaults, commented out — uncomment what
# you change. Y/U/D roles and normalization come from the frozen surrogate.
# Step counts are in timesteps of your data.

# ── SURROGATE ────────────────────────────────────────────────────
# Required: the MLflow run id `nt model train` printed ("Finished run: ...").
# Or pass it per run: --set sysid_run_id=<id>
sysid_run_id: ""
# Override the run's artifact directory.
# run_dir: null
# Explicit weights file; unset uses best_model_state_dict.pth from the run.
# weights: null

# ── DATA ─────────────────────────────────────────────────────────
# Required, never inherited from the sys-id run: train the policy on the
# windows you want it to control over.
train_data_path: data/train.csv
dev_data_path: data/dev.csv
test_data_path: data/test.csv
# batch_size: 256
# Hooks file (path or dotted module). Unset = control_user_defined.py in CWD.
# user_hooks_path: null

# ── HORIZON ──────────────────────────────────────────────────────
# Closed-loop rollout length in training. It has to span the behaviour you
# want learned — an action and the payoff it buys (a pre-cool and the coast
# after it, a daily peak) must fit inside one rollout.
# train_pred_steps: 48
# History the policy sees.
# in_steps: 12
# Future disturbance steps the policy previews. Ignored if the
# preview_config hook exists — that hook replaces it entirely.
# d_preview: 0

# ── TARIFF (optional; required together for cost_weight > 0) ─────
# One CSV per split: a timestamp column and a price column. Set all three
# paths and price_scale, or none. Price reaches the policy and the objective
# only; it is never a surrogate input.
# train_price_path: null
# dev_price_path: null
# test_price_path: null
# Only needed if a price CSV has more than one non-timestamp column.
# price_column: null
# Plant timesteps per price row (12 = hourly prices on 5-minute data).
# price_repeat: 1
# Divisor so the policy sees an O(1) price.
# price_scale: null
# Future price steps the policy sees. Shifting load means acting before the
# expensive hours, which a policy can only do if it sees them coming.
# price_preview: 0
# Where each window's price slice comes from: `random` (any offset, so the
# policy has to read the price) or `day` (same time of day as the plant
# window — plots line up with the plant's clock, but a tariff that peaks at
# the same hour daily becomes learnable as the clock instead).
# price_align: random

# ── COMFORT BAND ─────────────────────────────────────────────────
# Required, in the physical units of the regulated channel. Per segment,
# width ~ U[width_min, width_max] and lower edge ~ U[band_lo, band_hi - width].
# Train over the range of bands the policy will be handed in service.
band_lo: null
band_hi: null
# band_width_min: 0.5
# band_width_max: 2.0
# Segments per window: 1 = constant band, k > 1 = k-1 step changes.
# train_band_sub_samples: 1
# test_band_sub_samples: 4
# A separate band for evaluation — set it to the band you will be judged
# on, so the reportcard describes that case. Unset = the training values.
# test_band_lo: null
# test_band_hi: null
# test_band_width_min: null
# test_band_width_max: null

# ── OBJECTIVE ────────────────────────────────────────────────────
# Weights are scale factors between terms in different units, so they do
# not port between plants. Before training, every run prints each term's
# share of the objective and sweeps the power signal across the actuation
# box; the trained run's reportcard repeats the shares. A term at ~0% of
# the trained objective is not in the objective, whatever its weight says.
#
# Leaving the comfort band.
# comfort_weight: 50.0
# Step-to-step change in each actuator. A scalar, a list (one per U column,
# in the surrogate's order), or a mapping keyed by column name:
# du_weight: 10
# du_weight: {"Actuator A": 10, "Actuator B": 50}
#
# The three terms below are reductions of control_user_defined.power_metric,
# and each > 0 requires it (POWER_METRIC_IMPLEMENTED = True).
# Mean power.
# energy_weight: 0.0
# Mean price × power; also requires the TARIFF fields.
# cost_weight: 0.0
# Per-window power mean M_q — 1 = plain mean, 2 = RMS, larger approaches the
# peak. On its own it will happily raise total energy to flatten a profile,
# so pair it with energy_weight or cost_weight.
# peak_weight: 0.0
# peak_q: 4

# ── POLICY ───────────────────────────────────────────────────────
# mlp | linear. `linear` is one saturated affine law, u = sat(Kx + b): few
# parameters, gains you can read, and hard to overfit to the surrogate.
# policy: mlp
# gelu | relu | tanh | silu (mlp only).
# policy_nonlin: gelu
# How the output is squashed into the actuation box: sigmoid_scale (smooth)
# or relu_clamp (hard clip).
# policy_bound_method: sigmoid_scale
# Width 2**log2_policy_hidden (mlp only).
# log2_policy_hidden: 6
# policy_layers: 2
# Snap the output to a grid, in physical units (the actuator's resolution).
# Straight-through, so gradients still flow. 0 = continuous.
# setpoint_step: 0.0

# ── RESIDUAL CONTROL ─────────────────────────────────────────────
# Set to command reference_control(...) + δ with |δ| <= residual_delta, in
# physical units (needs the reference_control hook). It bounds how far
# surrogate error can move the plant from a rule you trust. null = a free
# policy over the whole actuation box. 0.0 = the rule itself, which is a
# cheap first run: it scores the rule on your surrogate. Must be at least
# setpoint_step when the output is quantized.
# residual_delta: null

# ── TRAINING ─────────────────────────────────────────────────────
# epochs: 300
# epoch_verbose: 1
# warmup: 5
# patience: 25
# lr: 0.001

# ── EVAL ─────────────────────────────────────────────────────────
# Closed-loop test window (warmup included) and stride. The defaults are one
# day of 5-minute data.
# test_window: 287
# test_stride: 288

# ── RUNTIME ──────────────────────────────────────────────────────
# seed: -1
# device: null
# verbose: true

# ── LOGGING ──────────────────────────────────────────────────────
# savedir: temp_<random>
# Must be the store the sys-id run was logged to.
# location: sqlite:///mlflow.db
# exp: DPC Training
run: ""
# plots_dir: plots
# plot: true
