# The objective is the goal, so it is yours to write; everything else is a default the
# run prints, `nt docs config` lists what can be set, and the latest model run is its model.
policy: mlp
horizon: 12h
epochs: 30
batch_size: 32
policy_window:
  "Zone [°C]": {past: 15m}
  "Outdoor [°C]": {past: 0, future: 6h}
  "Solar [W/m²]": {past: 0, future: 6h}
  "Band Low [°C]": {past: 0, future: 12h}
  "Band High [°C]": {past: 0, future: 12h}
  "Tariff [$/kWh]": {past: 0, future: 12h}
losses:
  comfort_lower: {column: "Band Low [°C]", target: "Zone [°C]", map: relu, norm: 1}
  comfort_upper: {column: "Band High [°C]", target: "Zone [°C]", map: nrelu, norm: 1}
  cost: {column: power, norm: 1, weight: "Tariff [$/kWh]"}
  du: {column: "Cooling SP [°C]", map: first_difference, norm: 1}
gains: {comfort_lower: 100.0, comfort_upper: 100.0, cost: 10.0, du: 0.5}
