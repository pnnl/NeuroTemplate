# A 2-epoch run that exercises the whole control pipeline: nt control train --config control_configs/debug.yaml
# Copy the objective from your real config.
losses:
  comfort_lower: {column: "Band Low", target: "Zone Temperature", map: relu, norm: 1}
  comfort_upper: {column: "Band High", target: "Zone Temperature", map: nrelu, norm: 1}
gains: {comfort_lower: 1.0, comfort_upper: 1.0}
epochs: 2
warmup: 0
patience: 2
run: debug
