# DPC policy training config. `nt control train` reads this file by default.
# Fields are shown at their built-in defaults, commented out — uncomment what
# you change. Y/U/D roles come from the frozen surrogate. Everything here is
# in physical units.
# Step counts are in timesteps of your data. Column names and numbers in the
# examples are syntax from some other plant: use your columns, and size
# values as each comment says.

# ── SURROGATE ────────────────────────────────────────────────────
# Required: the MLflow run id `nt model train` printed ("Finished run: ...").
# Or pass it per run: --set sysid_run_id=<id>
sysid_run_id: ""
# Override the run's artifact directory.
# run_dir: null
# Explicit weights file; unset uses best_model_state_dict.pth from the run.
# weights: null

# ── DATA ─────────────────────────────────────────────────────────
# Required, never inherited from the sys-id run: train the policy on the
# windows you want it to control over.
train_data_path: data/train.csv
dev_data_path: data/dev.csv
test_data_path: data/test.csv
# batch_size: 256
# Hooks file (path or dotted module). Unset = nt_control.py in CWD.
# user_hooks_path: null

# ── REFERENCES ───────────────────────────────────────────────────
# The columns the objective names that are not the surrogate's: a band, a
# setpoint schedule, a tariff. One file per plant file, row-aligned with it
# and carrying exactly its timestamps (make_references.py writes them). Set
# all three or none. List one plant file several times against several
# reference files to train on several draws of the reference.
#
# Train over every band the policy will be handed in service; make the test
# reference the one you want it judged on. Check that every test band is
# reachable inside the actuation box (nt_control.actuation_bounds):
# a band the actuators cannot reach is unreachable by construction.
train_reference_path: data/train_reference.csv
dev_reference_path: data/dev_reference.csv
test_reference_path: data/test_reference.csv
# The divisor for each reference column that bounds no Y column (a tariff),
# so the policy sees an O(1) input: about the column's typical magnitude. A
# band column needs none: it is scaled like the column it bounds.
# reference_scale: {"Tariff [$/kWh]": 0.30}

# ── HORIZON ──────────────────────────────────────────────────────
# Closed-loop rollout length in training. It has to contain an action and
# the payoff it buys — a pre-conditioning and the period it pays off in —
# or the gradient never connects them. Memory and time grow with it.
# train_pred_steps: 48
# Rows between the starts of training windows. Unset, the policy's history
# depth, usually a few rows: many near-identical windows at the epoch's cost.
# train_stride: 72

# ── POLICY WINDOW ────────────────────────────────────────────────
# Required: what the policy reads, per column — `past`, the steps before the
# current one, and for a forecast `future`, the steps after it. List every
# Y, U and D column of the surrogate and every reference column the
# objective names; there is no default.
#   Y          past only: not measured ahead.
#   U          past only, and its window ends at the previous step: `past: 1`
#              is the last command applied, `past: 0` does not read it. A
#              first_difference row penalizes a move; reading the last
#              command lets the policy see the move it is making.
#   D, ref.    past and future. A policy that sees only the current price can
#              react to it but not act ahead of it; it has to see the
#              expensive period coming, and the forecast that drives the
#              cost (the weather) to a similar depth, or it has to guess
#              which of the two it is answering. Longer is not better: a
#              window much longer than the cycle it acts on gives the policy
#              more to fit noise to.
# The deepest `past` (plus the current step) is the policy's history, which
# also spaces the training windows. The reportcard lists the table and the
# input width it gives. Names and numbers below are syntax.
policy_window: {}   # replace with your columns, e.g.
# "Zone Air Temperature [°C]":  {past: 3}
# "Zone Cooling Setpoint [°C]": {past: 1}
# "Outdoor Temperature [°C]":   {past: 0, future: 12}
# "Comfort Low [°C]":           {past: 0, future: 2}
# "Comfort High [°C]":          {past: 0, future: 2}

# ── OBJECTIVE ────────────────────────────────────────────────────
# A table of terms, each read in one order: the operand `column − target`
# (target optional), then `map` (relu = a lower bound, nrelu = an upper
# bound, first_difference = step-to-step change), then `norm` (the power
# mean per window: 1 = mean, 2 = RMS, larger approaches the max), with an
# optional per-step `weight` column; then its gain. `column`, `target` and
# `weight` name a Y, U or D column of the surrogate, a reference column, or
# `power` (nt_control.power_metric). A gain is per physical unit of
# its operand.
#
# Smoothing: one first_difference row per U column, each with its own gain.
# Every move the policy makes costs the plant something the surrogate may
# not price (equipment cycling, wear); this row is the only thing that
# charges for it, and an actuator that should mostly sit still wants a
# heavy one.
#
# A band you must hold: norm 1 (a mean of the excess) behaves as a near-hard
# constraint once its gain outweighs what an overshoot would save, and keeps
# its gradient at the band edge. norm 2 (RMS) makes a small overshoot nearly
# free next to the bill, and a policy takes the trade.
#
# Energy vs cost: an energy row rewards less power at every hour, and its
# cheapest answer is to do less. Only a cost row (power weighted by a
# tariff) rewards moving power to cheap hours. For load shifting, use cost
# and leave energy off.
losses: {}   # replace with your terms, e.g.
# comfort_lower: {column: "Comfort Low [°C]",  target: "Zone Air Temperature [°C]", map: relu,  norm: 1}
# comfort_upper: {column: "Comfort High [°C]", target: "Zone Air Temperature [°C]", map: nrelu, norm: 1}
# du:            {column: "Zone Cooling Setpoint [°C]", map: first_difference, norm: 1}
# energy: {column: power, norm: 1}
# cost:   {column: power, norm: 1, weight: "Tariff [$/kWh]"}
# peak:   {column: power, norm: 4}
# One gain per term, in its own map so a sweep can --set it. Gains are
# exchange rates between terms in different units, so they do not port
# between plants; the 1.0s below are placeholders, not starting values.
# Size them in this order, each move a decade at a time, reading the
# closed-loop plot after each run:
#   1. The band terms, until the trained policy keeps its outputs inside
#      the band. Out of band, the band terms carry the whole gradient and
#      everything else is decoration.
#   2. The first_difference rows, until the commands stop jittering.
#   3. Cost, until the trajectory shows the trade you want — acting before
#      the expensive period, holding at the band edge through it. Too much
#      shows just as clearly: outputs pushed past the band edge and held.
# Every run prints each term's share of the objective before and after
# training. The pre-training print is taken at the policy's starting point
# (for a residual, the rule itself, where a first_difference term is 0% by
# construction); it tells you a term is present, not that it is strong
# enough. Read strength off the trained share and the trajectory.
gains: {}   # one per term, e.g. {comfort_lower: 1.0, comfort_upper: 1.0, du: 1.0}

# ── POLICY ───────────────────────────────────────────────────────
# linear | mlp | mpc. `linear` is one saturated affine law, u = sat(Kx + b):
# few parameters, gains you can read, and little it can learn from the
# surrogate that the plant does not share. Reach for `mlp` when the linear
# law visibly cannot express the behaviour and the incentive for it is
# visibly in the objective; extra size tends to buy jitter. `mpc` trains
# nothing: every step it plans the next mpc_horizon steps through the
# surrogate and commands the first. It costs a solve per step, where a
# policy costs one forward pass; the Controller gap says what a policy leaves.
# policy: linear
# mpc_horizon: 72      # steps; every D and reference `future` must reach it
# mpc_lr: 0.02         # Adam, a share of each command's range per step
# mpc_rtol: 0.001      # an improvement smaller than this share of the objective...
# mpc_patience: 10     # ...for this many steps ends a window's solve
# mpc_max_iters: 200   # the cap; the reportcard says how often a solve hit it
# gelu | relu | tanh | silu (mlp only).
# policy_nonlin: gelu
# How the output is squashed into the actuation box: sigmoid_scale (smooth)
# or relu_clamp (hard clip).
# policy_bound_method: sigmoid_scale
# Width 2**log2_policy_hidden (mlp only).
# log2_policy_hidden: 3
# policy_layers: 1

# ── RESIDUAL CONTROL ─────────────────────────────────────────────
# Per U column, a box [below, above] in that column's physical units: the
# column commands reference_control(...)[column] + δ with
# -below <= δ <= above (needs the reference_control hook, returning exactly
# these columns). A U column not named is a free policy output over its
# actuation bounds; leave the map out for a plain policy. Every box [0, 0]
# is the rule itself: a cheap first run that scores the rule on your
# surrogate, and the number every later run is read against. How to size a
# box: the comment above reference_control in nt_control.py.
# residual_delta:
#   Heating Setpoint [°C]: [0.0, 0.0]
#   Cooling Setpoint [°C]: [below, above]

# Per-step bounds: the policy's range for a column, mapped onto [low, high] at
# each step, each side a number in the column's units, a reference column
# the policy reads, or another command. Inside the band for
# cooling and under its floor for heating keeps them from crossing; a side
# naming the other command orders them directly ([["Heating Setpoint [°C]",
# 1.0], 30.0]). Not with residual_delta on the same column. A side
# [column, offset] adds a signed offset: a margin inside an edge, since
# equipment that starts only past its setpoint overshoots one held at the edge.
# command_bounds:
#   Cooling Setpoint [°C]: ["Comfort Low [°C]", ["Comfort High [°C]", -0.5]]
#   Heating Setpoint [°C]: [15.0, "Comfort Low [°C]"]

# ── TRAINING ─────────────────────────────────────────────────────
# Train to convergence and no further: past it the policy learns the
# surrogate's quirks, which the plant does not have.
# epochs: 300
# warmup: 5
# patience: 25
# lr: 0.001

# ── EVAL ─────────────────────────────────────────────────────────
# Closed-loop test window (warmup included) and stride. The defaults are one
# day of 5-minute data; the warmup is the longer of the policy's history and the
# surrogate's, so with a long context_steps raise test_window past it.
# test_window: 287
# test_stride: 288
# The best open-loop plan over the same windows, the policy's bar on the
# reportcard ("Controller gap"), solved as MPC is, from plan_starts starts:
# the policy's own commands and random ones, each window keeping its best.
# More starts tighten the bar on a non-convex objective; 0 skips it.
# plan_starts: 4
# plan_lr: 0.02
# plan_rtol: 0.001
# plan_patience: 10
# plan_max_iters: 200

# ── RUNTIME ──────────────────────────────────────────────────────
# One seed is one draw, and nothing reports the spread between seeds here:
# before believing a difference between two configs, train each on a few.
# seed: -1
# device: null
# Torch CPU threads; null keeps torch's one per core. One was fastest for
# every model measured: the tensors are too small to share out.
# threads: 1
# What training prints: summary (seconds per epoch, then why it stopped and
# the best dev loss), live (one line updated in place), log (the same line,
# kept), or silent. live and log update every `update_every` epochs.
# progress: summary
# update_every: 10

# ── LOGGING ──────────────────────────────────────────────────────
# savedir: temp_<random>
# Must be the store the sys-id run was logged to.
# location: sqlite:///mlflow.db
# exp: DPC Training
run: ""
# plots_dir: plots
# plot: true
