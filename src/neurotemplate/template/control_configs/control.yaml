# Every setting for `nt control train`, at its default: what a run with no
# --config reads. It is the reference; change a setting in custom.yaml.
# `nt docs config` explains each field; a window is a time: 5h, 20m, 6s. The
# objective, `losses` and `gains`, has no default: a run needs one.

# ---- Sys-Id Model To Control Against -----------------------------------------
# The model run to control against.
# Empty: the latest finished one.
sysid_run_id: ''
# Optional override for the run's artifacts directory.
run_dir: null
# Optional explicit weights path (else best_model_state_dict.pth).
weights: null

# ---- Data --------------------------------------------------------------------
# The record (`common.data_file`). The columns the objective, a window or a
# bound names that are not the surrogate's — a comfort band, a tariff — are
# columns no role claims in that record: they reach the policy and the loss,
# never the surrogate.
data_file: data.yaml
# Training windows per optimizer step.
batch_size: 256
# The same record against another band or tariff. Each file replaces the columns
# it shares with the record it matches by timestamp, and adds a pass over the
# training windows. Dev and test take no draws: to score a held-out tariff,
# point `test` at a file holding it. Relative paths are read from the working
# directory.
draws: []
# Divisor per reference column that bounds no Y column (a tariff, a power cap),
# so the policy sees an O(1) input. Pure scaling, no shift, so a zero stays a
# zero. A column that bounds a Y column uses that column's normalisation
# instead, and must not be listed here. A column not listed: its largest
# magnitude in the training record.
reference_scale: {}
# The control hooks file, as a path or a module name.
# null: `nt_control.py` in the working directory.
user_hooks_path: null

# ---- Control Horizon / Policy Window -----------------------------------------
# How far ahead a training rollout predicts; for `policy: mpc`, how far each
# step plans (every D and reference column's `future` must reach it).
# null: 48 steps.
horizon: null
# Time between the starts of dev windows. Training windows start at any row of
# the records, drawn afresh at every step.
# null: a whole `horizon`.
dev_stride: null
# What the policy reads, any column of the record, listed only if it is read:
# `{column: {past: n, future: m}}`, steps before and after the current one. A Y
# or U column takes no `future` (not yet measured, or the policy's own output);
# any other column requires one. A U column's window ends at the previous step,
# the last command applied, so `past: 0` means the policy does not read it. A
# forecast's `stride` thins its future to every so many steps:
# `{past: 0, future: 6h, stride: 45m}` reads now and 8 rows ahead; with none,
# every row. See control.policy.build_policy. A trained policy's package takes
# only what is listed.
# Empty: the regulated outputs and the D columns 3 steps back, the last command,
# and each D and reference column a horizon ahead.
policy_window: {}

# ---- Objective ---------------------------------------------------------------
# A table of loss terms over named columns, and one gain per term, under the
# same names. A term is `{column: Band Low, target: Zone, map: relu, norm: 1}`:
# a `relu` term is a lower bound on `target`, an `nrelu` one an upper bound, and
# `{column: power, norm: 1, weight: Tariff}` prices what `power_channels`
# meters. A band or a tariff is a column of the record no role claims. See
# `nt docs control` for every map. Two flat dicts, so a gain can be swept with
# --set without restating the table.
losses: {}
gains: {}

# ---- Policy Network ----------------------------------------------------------
# Network family (see control.policy.policy_catalog). "linear" ignores
# policy_layers / log2_policy_hidden / policy_nonlin and produces a single
# saturated affine feedback law: the default, because it has little it can learn
# from the surrogate that the plant does not share. "mpc" trains nothing: it
# plans through the surrogate at every step (control.mpc).
policy: linear
# The hidden layers' activation.
policy_nonlin: gelu
# How the network output is squashed into [umin, umax]: "sigmoid_scale" (smooth,
# never exactly reaches the limits) or "relu_clamp" (hard clip).
policy_bound_method: sigmoid_scale
# The hidden layers' width, as a power of two (3 is 8 units), and how many.
log2_policy_hidden: 3
policy_layers: 1
# Each solve of `policy: mpc` and of `nt control gap`; see SOLVER_DEFAULTS. Name
# only what you change.
solver: {lr: 0.02, max_iters: 200, patience: 10, rtol: 0.001}
# What a U column may command, `{column: [low, high]}`: each side a number in
# the column's units, the name of a column (a reference the policy reads, or
# another command), or `[column, offset]`, that column plus a signed offset in
# the U column's units. A column not listed takes its recorded range, the region
# the surrogate was identified on; a side that names a column moves at each
# step. A side naming another command orders the two:
# `{Cool: [[Heat, 1.0], 30.0]}` holds cooling at least 1 above heating at every
# step.
control_bounds: {}
# What training and dev rollouts start from: `{Y column: [low, high]}` draws
# that column's last measured value uniform in the box, whatever the window's
# weather; `{Y column: records}`, over its range in the training records.
# Columns not listed start as recorded.
# null: every `rc_network` zone over its recorded range; `{}`: every column as
# recorded. Test always starts as recorded (`control.windows`).
start_box: null

# ---- Training ----------------------------------------------------------------
# How many steps a run trains. It scores dev 20 times along the way and keeps
# the best policy.
iters: 3000
# The learning rate of the policy's weights (Adam), at its peak: it ramps up
# over the first 5% of the steps, then eases down to a hundredth of it.
lr: 0.001
# What training prints: silent | summary | live | log (`common.progress`).
progress: summary

# ---- Evaluation (Long Closed-Loop Rollout) -----------------------------------
# How far ahead a test rollout runs, and how far apart they start.
# null: 288 steps, or as much as the shortest test file holds; and end to end.
test_horizon: null
test_stride: null

# ---- Runtime -----------------------------------------------------------------
# -1 draws a seed from the clock; any other value repeats a run's draws.
seed: -1
# cpu, cuda or mps.
# null: cuda if available, else cpu.
device: null
# Torch CPU threads for this run; None means one per core. These models are
# small enough that one thread was fastest for every family and batch size
# measured.
threads: 1

# ---- Logging -----------------------------------------------------------------
# Where runs are recorded (an MLflow tracking URI), the experiment they go
# under, and a name to tell this run by.
location: sqlite:///mlflow.db
exp: DPC Training
run: ''
# Where a run's plots go, and whether it draws them.
plots_dir: plots
plot: true
