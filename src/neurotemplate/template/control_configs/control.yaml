# Settings for `nt control train`. The objective is the goal, so it is yours to edit: these names are
# some other plant's. A `relu` row is a lower bound and an `nrelu` row an upper one; `power` is what
# `power_channels` meters. A band or a tariff is a column of the record no role claims. `nt docs config`
# lists every other field; each run prints the defaults it used, and the latest model run is its model.
losses:
  comfort_lower: {column: "Band Low", target: "Zone Temperature", map: relu, norm: 1}
  comfort_upper: {column: "Band High", target: "Zone Temperature", map: nrelu, norm: 1}
  moves: {column: "Cooling Setpoint", map: first_difference, norm: 1}
  cost: {column: power, norm: 1, weight: "Tariff"}
gains: {comfort_lower: 100.0, comfort_upper: 100.0, moves: 0.5, cost: 1.0}
