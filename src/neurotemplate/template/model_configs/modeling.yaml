# System-ID surrogate config. `nt model train` reads this file by default.
# Fields are shown at their built-in defaults, commented out — uncomment what
# you change. Override any of them per run with `--set key=value`, and check
# the result with `--print-config`. Step counts are in timesteps of your data.
# Change one thing per run and keep each run's config (a numbered copy), so
# the sequence stays readable afterwards.

# ── DATA ─────────────────────────────────────────────────────────
# Required. Each may be one path or a list; files in a list are windowed
# independently and pooled, so no window spans two files.
train_data_path: data/train.csv
dev_data_path: data/dev.csv
test_data_path: data/test.csv
# batch_size: 256
# min_max | abs_max | z_score | null. Per-column overrides: column_norm_config.
# norm_type: z_score
# Substring patterns; every column matching one is dropped from data_mapping's roles.
# exclude_columns: []
# Hooks file (path or dotted module). Unset = nt_model.py in CWD.
# user_hooks_path: null

# ── MODEL ────────────────────────────────────────────────────────
# Test error is measured on whatever excitation your data has, which is
# rarely where a controller will drive the plant; it does not pick a
# surrogate for control. The reportcard's rollout and physics sections
# are the readouts for that.
# Family: mlp | nssm | lssm | gru | rc_network | thermostat.
#   rc_network, thermostat   grey-box thermal parts, each a block: a declared RC
#          network driven by its inputs, and a thermostat producing a heat, every
#          parameter physical and boxed. `nt data ladder` and `nt data thermostat`
#          write their declarations (`nt guide thermal-zone`).
#   mlp, nssm, lssm, gru   black boxes. Often the best fit, but nothing
#          bounds a long rollout; read the reportcard's rollout and
#          physics sections before steering with one.
# Every block without its own `model` takes this one, so one line swaps them. See
# `block_mapping` in nt_model.py (e.g. a thermostat and an rc_network per zone, an
# mlp for a meter). Or the name of a model of your own, from `custom_models` there.
# model: nssm
# Required: steps before the current one a learned map reads, per column. List
# every Y, U and D column; there is no default. The names and numbers below
# are syntax, not values. A gru reads one lag for every column it reads (its
# window is its warm-up). The thermal blocks are not in this table, so a column
# only they read is listed at 0. A lag is worth its inputs when the column still
# tells the model something, that far back, that its other inputs do not; the
# reportcard lists what each block reads.
history: {}   # replace with your columns, e.g.
#  "Tank Temperature [degC]": 11
#  "Heater Command [-]": 0
#  "Ambient Temperature [degC]": 3
# Rows of history every model is handed, beyond what `history` asks: what a model
# that keeps state starts from. An rc_network's filter places its hidden nodes
# from this window, and one with hidden nodes refuses to build without it: long
# enough is when a longer one stops changing the day-ahead error.
# context_steps: 0
# Network width is 2**log2_hidden_size; the thermal blocks have no net. Larger nets tend to buy fit with physics: start small, and grow one when
# the reportcard says the model underfits, not because dev loss went down.
# log2_hidden_size: 6
# num_layers: 3
# Predict the change from the current state rather than the state. A block
# may say otherwise for itself (`residual` in block_mapping): a meter is a value.
# residual: true
# One block's family, from here: {block name: family}. It wins over a block's
# own `model` in block_mapping, which wins over `model` above. Each run prints
# which family each block took and from where.
# block_models: {}

# ── PHYSICAL PARAMETERS ──────────────────────────────────────────
# A grey box's parameters are declared as boxes in block_mapping's `params`
# (nt_model.py). Here only their learning rate: at `lr` they
# barely leave their start.
# physical_lr: 0.05

# ── TRAIN ────────────────────────────────────────────────────────
# epochs: 300
# Epochs before early stopping may trigger, then epochs without improvement.
# warmup: 5
# patience: 25
# Rollout length per training window. A rollout much shorter than the
# plant's slow dynamics lets a model re-read its inputs instead of learning
# to integrate them.
# train_pred_steps: 48
# Rows between the starts of training and dev windows. Unset, one window per
# window depth (history_steps): with a long context_steps that is few windows,
# and with batch_size above their number, one update per epoch.
# train_stride: 288
# Stages that each multiply train_pred_steps by curriculum_ratio. 0 = off.
# curriculum_steps: 0
# curriculum_ratio: 4.0
# lr: 0.001
# Fixed validation horizon, so dev loss compares across curriculum stages.
# dev_pred_steps: 48
# Test window length (history_steps included) and stride. The defaults are one
# day of 5-minute data; with a long context_steps, raise test_window past it.
# test_window: 287
# test_stride: 288

# ── LOSS ─────────────────────────────────────────────────────────
# ref_gain: 1.0          # state-tracking error

# ── BINARY / ORDINAL HEADS ───────────────────────────────────────
# Weight each levelled head's loss by inverse square-root level frequency.
# balance_levels: true
# After training, fit each ordinal head's thresholds on dev rollouts.
# calibrate_thresholds: true

# ── RUNTIME ──────────────────────────────────────────────────────
# -1 draws a random seed and records it with the run.
# seed: -1
# Train this many seeds (seed, seed+1, ...) and report their spread on the
# reportcard; only the first is saved. Differences between two configs are
# often inside this spread on small datasets.
# ensemble_seeds: 1
# cpu | cuda | mps; unset auto-detects.
# device: null
# Torch CPU threads; null keeps torch's one per core. One was fastest for
# every model measured: the tensors are too small to share out.
# threads: 1
# What training prints: summary (seconds per epoch, then why it stopped and
# the best dev loss), live (one line updated in place), log (the same line,
# kept), or silent. live and log update every `update_every` epochs.
# progress: summary
# update_every: 10

# ── LOGGING ──────────────────────────────────────────────────────
# Scratch dir for run artifacts; unset generates a unique temp_<hash>.
# savedir: temp_<random>
# location: sqlite:///mlflow.db
# exp: Model Training
# MLflow run name; the family is prefixed automatically.
run: ""
# plots_dir: plots
# plot: true
# Which weights to keep: last_step (the run's final checkpoint), all (that,
# plus each curriculum stage's in its child run) or None (none; the run
# cannot be reloaded).
# save_config: last_step

# ── OPTUNA (nt model optuna) ─────────────────────────────────────
# The search space is nt_model.hyper_args.
# n_trials: 100
# study_name: study
# Epochs per trial; the winner is retrained for the full `epochs`.
# trial_epochs: 100
# optuna_dir: optuna_dbs
# Seeds averaged per trial.
# trial_seeds: 3

# ── PHYSICS ──────────────────────────────────────────────────────
# Gradient-sign penalty, evaluated at random off-trajectory points: the
# mean sign violation per declared (output, input) pair, so a gain means the
# same however many channels the plant has. 0 = off; > 0 requires grad_path
# (written by write_gradient_mapping in nt_model.py). Size it by
# what the physics section does, not by switching it on.
# grad_gain: 0.0
# grad_path: data/grad/mapping.json
# grad_n_samples: 128
# The physics checks (equilibrium, step response, reachability, free decay)
# run after training whenever synth_cfg returns a spec. They are instruments:
# read a failure as a diagnosis (see synth_cfg), not as a wall. Instances per check,
# and horizon in hours: raise the count if pass rates swing between seeds,
# and keep the horizon comparable to the plant's slow time constant.
# synth_n_scenarios: 32
# synth_hours: 4.0
# Instances drawn on the diagnostic figures.
# synth_n_plot: 4
