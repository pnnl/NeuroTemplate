# Where the record is, and which column plays which role, once, for the model and
# the controller. A split may be a list of files; no rollout window spans two.
train: data/train.csv
dev: data/dev.csv
test: data/test.csv
# `nt model train` lists the record's columns while this is empty, ready to paste.
# Y: what the model predicts. U: what a controller writes. D: what is known without
# the plant. A column left out is not read by the model; a band or a tariff sits in the
# record that way, and the controller's objective just names it.
columns: {}
